services:
  postgres:
    image: postgres:18
    container_name: exercise-profiling-db
    environment:
      POSTGRES_DB: advpro-2024
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: my-password
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d advpro-2024"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    container_name: exercise-profiling-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/advpro-2024
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: my-password
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
